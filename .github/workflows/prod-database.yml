name: Production Database Competitions

on:
  pull_request:
    paths:
      - 'data/**'
      - 'simulation/competitions/**'
      - 'tests/database_competitions_test.gd'
      - 'tools/test-headless.ps1'
      - '.github/workflows/prod-database.yml'
  push:
    branches: ['prod/database-competitions']

permissions:
  contents: read

jobs:
  database:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
      - name: Import project
        shell: powershell
        run: .\tools\test-headless.ps1 -Script import
      - name: Run database and competition acceptance
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/database_competitions_test.gd -TimeoutSeconds 90
