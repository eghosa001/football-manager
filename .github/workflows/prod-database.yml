name: Production Database Competitions

on:
  pull_request:
    paths:
      - 'data/**'
      - 'simulation/competitions/**'
      - 'tests/database_competitions_test.gd'
      - '.github/workflows/prod-database.yml'
  push:
    branches: ['prod/database-competitions']

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - run: godot --headless --editor --path . --quit
      - name: Run database and competition acceptance
        run: timeout 90s godot --headless --path . --script res://tests/database_competitions_test.gd
