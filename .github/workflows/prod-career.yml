name: Production Career UX

on:
  pull_request:
    paths:
      - 'application/career/**'
      - 'game/career/**'
      - 'tests/career_session_test.gd'
      - '.github/workflows/prod-career.yml'
  push:
    branches: ['prod/playable-career-ux']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  career:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script import
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/career_session_test.gd
