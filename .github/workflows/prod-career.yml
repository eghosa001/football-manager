name: Production Career UX

on:
  pull_request:
    paths:
      - 'application/career/**'
      - 'game/career/**'
      - 'tests/career_session_test.gd'
      - '.github/workflows/prod-career.yml'
  push:
    branches: ['prod/playable-career-ux']

permissions:
  contents: read

jobs:
  career:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - run: godot --headless --editor --path . --quit
      - run: godot --headless --path . --script res://tests/career_session_test.gd
