name: Production Player Scouting Transfers

on:
  pull_request:
    paths:
      - 'simulation/players/**'
      - 'simulation/scouting/**'
      - 'simulation/transfers/**'
      - 'simulation/staff/**'
      - 'tests/player_scouting_test.gd'
      - '.github/workflows/prod-player-scouting.yml'
  push:
    branches: ['prod/player-scouting-transfers']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  player-scouting:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script import
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/player_scouting_test.gd
