name: Build Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'application/**'
      - 'game/**'
      - 'persistence/**'
      - 'simulation/**'
      - 'ui/**'
      - 'tests/mobile_export_test.gd'
      - 'tests/ui_readability_test.gd'
      - 'tools/**'
      - '.github/workflows/debug-apk.yml'
  pull_request:
    paths:
      - 'project.godot'
      - 'export_presets.cfg'
      - 'application/**'
      - 'game/**'
      - 'persistence/**'
      - 'simulation/**'
      - 'ui/**'
      - 'tests/mobile_export_test.gd'
      - 'tests/ui_readability_test.gd'
      - 'tools/**'
      - '.github/workflows/debug-apk.yml'

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot and Android SDK
        run: |
          godot --version
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          java -version

      - name: Import project
        run: bash tools/test-headless.sh import 600

      - name: Validate Android preset
        run: bash tools/test-headless.sh tests/mobile_export_test.gd 600

      - name: Validate mobile readability contract
        run: bash tools/test-headless.sh tests/ui_readability_test.gd 300

      - name: Configure direct debug APK export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          preset = Path('export_presets.cfg')
          s = preset.read_text()
          start = s.index('[preset.2]')
          end = s.index('[preset.3]')
          block = s[start:end]
          block = block.replace('export_path="build/android/FootballDynasty.aab"', 'export_path="build/android/FootballDynasty-debug.apk"')
          block = block.replace('gradle_build/use_gradle_build=true', 'gradle_build/use_gradle_build=false')
          block = block.replace('gradle_build/export_format=1', 'gradle_build/export_format=0')
          # Direct Godot APK export must not carry Gradle-only SDK overrides.
          # Strip both fields regardless of their configured values so future
          # store-target SDK changes cannot break this device-test path.
          block = re.sub(r'^gradle_build/(?:min_sdk|target_sdk)=.*\n', '', block, flags=re.MULTILINE)
          preset.write_text(s[:start] + block + s[end:])

          project = Path('project.godot')
          p = project.read_text()
          flag = 'textures/vram_compression/import_etc2_astc=true'
          if flag not in p:
              marker = '[rendering]\n'
              p = p.replace(marker, marker + flag + '\n', 1)
              project.write_text(p)
          PY
          mkdir -p build/android

      - name: Re-import Android textures
        run: godot --headless --editor --path . --import --quit

      - name: Build debug APK
        run: godot --headless --path . --export-debug "Android" build/android/FootballDynasty-debug.apk

      - name: Verify APK
        run: |
          test -s build/android/FootballDynasty-debug.apk
          file build/android/FootballDynasty-debug.apk
          sha256sum build/android/FootballDynasty-debug.apk | tee build/android/FootballDynasty-debug.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: FootballDynasty-debug-apk
          path: |
            build/android/FootballDynasty-debug.apk
            build/android/FootballDynasty-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
