name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: football-fast-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: true

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: bash tools/test-headless.sh import 300

      - name: Run merge-critical regressions
        shell: bash
        run: |
          set -euo pipefail
          while read -r test timeout; do
            echo "===== $test ====="
            bash tools/test-headless.sh "$test" "$timeout"
          done <<'EOF'
          tests/managed_matchday_compile_test.gd 120
          tests/architecture_convergence_test.gd 300
          tests/test_runner.gd 240
          tests/career_session_test.gd 240
          tests/save_safety_test.gd 300
          tests/production_readiness_contract_test.gd 300
          EOF

      - name: Verify source remained clean
        run: git diff --exit-code -- .
