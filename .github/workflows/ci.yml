name: CI

on:
  push:
    branches: [main, phase-3-season-persistence-core]
  pull_request:
  workflow_dispatch:
    inputs:
      full_match_validation:
        description: Run 100,000-match validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Verify engine
        run: godot --version

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run Phase 1/2 tests
        run: godot --headless --path . --script res://tests/test_runner.gd

      - name: Run Phase 3 tests
        run: godot --headless --path . --script res://tests/phase3_test_runner.gd

      - name: Install Godot-SQLite v4.9
        run: |
          curl -L --fail --retry 3 https://github.com/2shady4u/godot-sqlite/releases/download/v4.9/addons.zip -o /tmp/godot-sqlite-addons.zip
          echo "95e91b72fe32984a84edaf6357a78753661f37a170cb362f5b948e0ede7c2cb0  /tmp/godot-sqlite-addons.zip" | sha256sum -c -
          unzip -q /tmp/godot-sqlite-addons.zip -d .

      - name: Run SQLite integration
        run: godot --headless --path . --script res://tests/sqlite_integration_test.gd

      - name: Run 100k match validation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_match_validation }}
        run: godot --headless --path . --script res://tests/test_runner.gd -- --full-match-validation
