name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: bash tools/test-headless.sh import 600

      - name: Architecture regression
        run: bash tools/test-headless.sh tests/architecture_convergence_test.gd 600

      - name: Codebase robustness regression
        run: bash tools/test-headless.sh tests/codebase_robustness_regression_test.gd 600

      - name: App speed breakdown
        run: bash tools/test-headless.sh tests/app_speed_breakdown_test.gd 120

      - name: Performance baseline
        run: bash tools/test-headless.sh tests/performance_baseline_test.gd 240

      - name: Spatial engine robustness regression
        run: bash tools/test-headless.sh tests/spatial_engine_robustness_test.gd 600

      - name: UI2 interaction regression
        run: bash tools/test-headless.sh tests/ui2_runtime_integration_test.gd 600

      - name: Staff UI action regression
        run: bash tools/test-headless.sh tests/staff_ui_action_test.gd 600

      - name: Settings UI round-trip regression
        run: bash tools/test-headless.sh tests/settings_ui_roundtrip_test.gd 600

      - name: Database editor UI regression
        run: bash tools/test-headless.sh tests/database_editor_ui_test.gd 600

      - name: Legacy core regression
        run: bash tools/test-headless.sh tests/test_runner.gd 240

      - name: Career session regression
        run: bash tools/test-headless.sh tests/career_session_test.gd 240

      - name: Save and backup safety
        run: bash tools/test-headless.sh tests/save_safety_test.gd 600

      - name: Training state regression
        run: bash tools/test-headless.sh tests/training_session_test.gd 600

      - name: Transfer window regression
        run: bash tools/test-headless.sh tests/transfer_window_country_test.gd 600

      - name: Club economy regression
        run: bash tools/test-headless.sh tests/club_economy_service_test.gd 600

      - name: Career rollover and save-load regression
        run: bash tools/test-headless.sh tests/career_rollover_test.gd 600

      - name: Production readiness contract
        run: bash tools/test-headless.sh tests/production_readiness_contract_test.gd 600

      - name: Verify source remained clean
        run: git diff --exit-code -- .
