name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: true

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: false

      - name: Import project
        run: bash tools/test-headless.sh import 600

      - name: Architecture regression
        run: bash tools/test-headless.sh tests/architecture_convergence_test.gd 600

      - name: Codebase robustness regression
        run: bash tools/test-headless.sh tests/codebase_robustness_regression_test.gd 600

      - name: Production readiness contract
        run: bash tools/test-headless.sh tests/production_readiness_contract_test.gd 600

      - name: Verify source remained clean
        run: git diff --exit-code -- .
