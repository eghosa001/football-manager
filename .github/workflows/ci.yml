name: CI

on:
  push:
    branches: [main, phase-10-11-living-world-release]
  pull_request:
  workflow_dispatch:
    inputs:
      full_match_validation:
        description: Run 100,000-match validation
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Import project
        shell: powershell
        run: .\tools\test-headless.ps1 -Script import

      - name: Run Phase 1/2 tests
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/test_runner.gd

      - name: Run Phase 3 tests
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/phase3_test_runner.gd

      - name: Run Phase 4/5 tests
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/phase45_test_runner.gd

      - name: Run Phase 6/7 tests
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/phase67_test_runner.gd

      - name: Run Phase 8/9 tests
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/phase89_test_runner.gd

      - name: Run Phase 10/11 tests
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/phase1011_test_runner.gd

      - name: Resolve Godot for exports
        shell: powershell
        run: |
          $candidate = $null
          if ($env:GODOT_EXE -and (Test-Path $env:GODOT_EXE)) { $candidate = $env:GODOT_EXE }
          elseif ($env:GODOT_PATH -and (Test-Path $env:GODOT_PATH)) { $candidate = $env:GODOT_PATH }
          else {
            foreach ($name in @('godot','godot4')) {
              $cmd = Get-Command $name -ErrorAction SilentlyContinue
              if ($cmd) { $candidate = $cmd.Source; break }
            }
          }
          if (-not $candidate) { throw 'Godot executable not found for export.' }
          "GODOT_EXE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $candidate --version

      - name: Build Linux release candidate
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build/linux | Out-Null
          & $env:GODOT_EXE --headless --path . --export-release 'Linux/X11' build/linux/FootballDynasty.x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build/linux/FootballDynasty.x86_64) -or (Get-Item build/linux/FootballDynasty.x86_64).Length -le 0) { throw 'Linux export missing.' }

      - name: Build Windows release candidate
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          & $env:GODOT_EXE --headless --path . --export-release 'Windows Desktop' build/windows/FootballDynasty.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build/windows/FootballDynasty.exe) -or (Get-Item build/windows/FootballDynasty.exe).Length -le 0) { throw 'Windows export missing.' }

      - name: Smoke-test Windows release
        shell: powershell
        run: |
          $log = 'build/windows/runtime.log'
          $err = $log + '.err'
          $proc = Start-Process -FilePath (Resolve-Path 'build/windows/FootballDynasty.exe') -ArgumentList @('--headless','--','--release-smoke') -PassThru -NoNewWindow -RedirectStandardOutput $log -RedirectStandardError $err
          if (-not $proc.WaitForExit(180000)) { try { $proc.Kill($true) } catch {}; throw 'Windows release smoke timed out.' }
          $proc.Refresh()
          $exitCode = $proc.ExitCode
          $stdout = if (Test-Path $log) { Get-Content $log -Raw } else { '' }
          $stderr = if (Test-Path $err) { Get-Content $err -Raw } else { '' }
          Write-Host $stdout
          if ($stderr) { Write-Host $stderr }
          if ($null -ne $exitCode -and $exitCode -ne 0) { throw "Windows release smoke exited with code $exitCode." }
          if ($stdout -notmatch 'RELEASE SMOKE PASS') { throw 'Windows release smoke did not emit PASS marker.' }
          if (($stdout + "`n" + $stderr) -match 'SCRIPT ERROR:') { throw 'Windows release smoke reported a script error.' }

      - name: Install Godot-SQLite v4.9 if missing
        shell: powershell
        run: |
          if (Test-Path 'addons/godot-sqlite') { Write-Host 'Godot-SQLite already present; skipping download.'; exit 0 }
          $zip = Join-Path $env:RUNNER_TEMP 'godot-sqlite-addons.zip'
          Invoke-WebRequest -Uri 'https://github.com/2shady4u/godot-sqlite/releases/download/v4.9/addons.zip' -OutFile $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne '95e91b72fe32984a84edaf6357a78753661f37a170cb362f5b948e0ede7c2cb0') { throw 'Godot-SQLite checksum mismatch.' }
          Expand-Archive -Path $zip -DestinationPath . -Force

      - name: Run SQLite integration
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/sqlite_integration_test.gd

      - name: Run 100k match validation
        if: ${{ github.ref == 'refs/heads/phase-10-11-living-world-release' || (github.event_name == 'workflow_dispatch' && inputs.full_match_validation) }}
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/test_runner.gd -TimeoutSeconds 3600 -ExtraArgs @('--','--full-match-validation')
