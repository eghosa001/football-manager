name: CI

on:
  push:
    branches: [main, phase-10-11-living-world-release]
  pull_request:
  workflow_dispatch:
    inputs:
      full_match_validation:
        description: Run 100,000-match validation
        required: false
        default: false
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify engine
        run: godot --version

      - name: Import project
        run: godot --headless --editor --path . --quit

      - name: Run Phase 1/2 tests
        run: godot --headless --path . --script res://tests/test_runner.gd

      - name: Run Phase 3 tests
        run: godot --headless --path . --script res://tests/phase3_test_runner.gd

      - name: Run Phase 4/5 tests
        run: godot --headless --path . --script res://tests/phase45_test_runner.gd

      - name: Run Phase 6/7 tests
        run: godot --headless --path . --script res://tests/phase67_test_runner.gd

      - name: Run Phase 8/9 tests
        run: godot --headless --path . --script res://tests/phase89_test_runner.gd

      - name: Run Phase 10/11 tests
        run: godot --headless --path . --script res://tests/phase1011_test_runner.gd

      - name: Build Linux release candidate
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux/X11" build/linux/FootballDynasty.x86_64
          test -s build/linux/FootballDynasty.x86_64
          chmod +x build/linux/FootballDynasty.x86_64
          timeout 30s build/linux/FootballDynasty.x86_64 --headless --quit-after 1

      - name: Build Windows release candidate
        run: |
          mkdir -p build/windows
          godot --headless --path . --export-release "Windows Desktop" build/windows/FootballDynasty.exe
          test -s build/windows/FootballDynasty.exe

      - name: Install Godot-SQLite v4.9
        run: |
          curl -L --fail --retry 3 https://github.com/2shady4u/godot-sqlite/releases/download/v4.9/addons.zip -o /tmp/godot-sqlite-addons.zip
          echo "95e91b72fe32984a84edaf6357a78753661f37a170cb362f5b948e0ede7c2cb0  /tmp/godot-sqlite-addons.zip" | sha256sum -c -
          unzip -q /tmp/godot-sqlite-addons.zip -d .

      - name: Run SQLite integration
        run: godot --headless --path . --script res://tests/sqlite_integration_test.gd

      - name: Run 100k match validation
        if: ${{ github.ref == 'refs/heads/phase-10-11-living-world-release' || (github.event_name == 'workflow_dispatch' && inputs.full_match_validation) }}
        run: godot --headless --path . --script res://tests/test_runner.gd -- --full-match-validation
