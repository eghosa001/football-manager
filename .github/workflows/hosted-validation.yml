name: Hosted Validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: hosted-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout clean source
        uses: actions/checkout@v7
        with:
          clean: true

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
          include-templates: true

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: bash tools/test-headless.sh import 600

      - name: Architecture convergence
        run: bash tools/test-headless.sh tests/architecture_convergence_test.gd 300

      - name: Finance insolvency regression
        run: bash tools/test-headless.sh tests/club_economy_service_test.gd 300

      - name: Core simulation smoke
        run: bash tools/test-headless.sh tests/test_runner.gd 1200

      - name: Career and living-world smoke
        run: bash tools/test-headless.sh tests/phase1011_test_runner.gd 1200

      - name: Phase 12-14 completion gate
        run: bash tools/test-headless.sh tests/phase1214_completion_test.gd 300

      - name: Release hardening smoke
        run: bash tools/test-headless.sh tests/release_hardening_test.gd 1200

      - name: UI readability contract
        run: bash tools/test-headless.sh tests/ui_readability_test.gd 300

      - name: Responsive navigation contract
        run: bash tools/test-headless.sh tests/navigation_responsive_test.gd 300

      - name: Performance baseline
        run: bash tools/test-headless.sh tests/performance_baseline_test.gd 1200

      - name: Long-save safety
        run: bash tools/test-headless.sh tests/long_save_growth_test.gd 1200

      - name: Production readiness contract
        run: bash tools/test-headless.sh tests/production_readiness_contract_test.gd 300

      - name: Build Linux release candidate
        run: |
          mkdir -p build/linux
          godot --headless --path . --export-release "Linux/X11" build/linux/FootballDynasty.x86_64
          test -s build/linux/FootballDynasty.x86_64
          chmod +x build/linux/FootballDynasty.x86_64

      - name: Execute packaged Linux release smoke
        run: bash tools/release-smoke.sh build/linux/FootballDynasty.x86_64 build/linux/runtime.log 180

      - name: Verify Linux offline save filesystem
        run: |
          env -u HTTP_PROXY -u HTTPS_PROXY -u ALL_PROXY bash tools/release-smoke.sh build/linux/FootballDynasty.x86_64 build/linux/offline-runtime.log 180
          sha256sum build/linux/FootballDynasty.x86_64 | tee build/linux/FootballDynasty.x86_64.sha256

      - name: Upload Linux release evidence
        uses: actions/upload-artifact@v4
        with:
          name: FootballDynasty-linux-rc
          path: |
            build/linux/FootballDynasty.x86_64
            build/linux/FootballDynasty.x86_64.sha256
            build/linux/runtime.log
            build/linux/offline-runtime.log
          if-no-files-found: error
          retention-days: 14
