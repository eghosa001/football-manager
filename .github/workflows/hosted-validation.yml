name: Hosted Validation

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: hosted-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fast-pr-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: bash tools/test-headless.sh import 600

      - name: Architecture convergence
        run: bash tools/test-headless.sh tests/architecture_convergence_test.gd 300

      - name: Core simulation smoke
        run: bash tools/test-headless.sh tests/test_runner.gd 1200

      - name: Career and living-world smoke
        run: bash tools/test-headless.sh tests/phase1011_test_runner.gd 1200

      - name: Phase 12-14 completion gate
        run: bash tools/test-headless.sh tests/phase1214_completion_test.gd 300

      - name: Release hardening smoke
        run: bash tools/test-headless.sh tests/release_hardening_test.gd 1200
