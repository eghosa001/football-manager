name: Mobile Export Validation

on:
  push:
    branches: [main]
    paths:
      - 'export_presets.cfg'
      - 'tests/mobile_export_test.gd'
      - '.github/workflows/mobile.yml'
      - 'tools/**'
      - 'game/**'
      - 'ui/**'
  pull_request:
    paths:
      - 'export_presets.cfg'
      - 'tests/mobile_export_test.gd'
      - '.github/workflows/mobile.yml'
      - 'tools/**'
      - 'game/**'
      - 'ui/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          clean: false

      - name: Import project
        shell: powershell
        run: .\tools\test-headless.ps1 -Script import

      - name: Run mobile export validation
        shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/mobile_export_test.gd

      - name: Check preset paths (no SDK required)
        shell: powershell
        run: |
          if (-not (Test-Path export_presets.cfg)) { throw 'export_presets.cfg missing' }
          $text = Get-Content export_presets.cfg -Raw
          foreach ($needle in @('platform="Android"', 'platform="iOS"', 'platform="macOS"', 'build/android/FootballDynasty.aab', 'build/ios/FootballDynasty.xcodeproj', 'build/macos/FootballDynasty.app')) {
            if ($text -notmatch [regex]::Escape($needle)) { throw "missing $needle" }
          }
