name: Apply Verified Local Fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-local-sync.yml'
      - '.local-sync/**'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .local-sync/chunk*.b64 | base64 --decode > /tmp/local-fixes.tar.xz
          xz -t /tmp/local-fixes.tar.xz
          tar -xJf /tmp/local-fixes.tar.xz -C .

      - name: Commit tested tree and remove staging
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf .local-sync .github/workflows/apply-local-sync.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Apply Godot 4.7 validated fixes"
          git push origin HEAD:main
