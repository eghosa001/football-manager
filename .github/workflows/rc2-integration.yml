name: RC2 Integration

on:
  pull_request:
    paths:
      - 'application/career/**'
      - 'game/career/**'
      - 'data/**'
      - 'simulation/players/**'
      - 'simulation/scouting/**'
      - 'simulation/transfers/**'
      - 'simulation/match/**'
      - 'simulation/tactics/**'
      - 'simulation/competitions/**'
      - 'persistence/**'
      - 'tests/player_stats_test.gd'
      - 'tests/save_safety_test.gd'
      - 'tests/registration_safety_test.gd'
      - 'tests/career_ui_test.gd'
      - 'tests/rc2_integration_test.gd'
      - '.github/workflows/rc2-integration.yml'
  push:
    branches: ['prod/rc2-integration']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rc2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - run: godot --headless --editor --path . --quit
      - run: timeout 120s godot --headless --path . --script res://tests/player_stats_test.gd
      - run: timeout 120s godot --headless --path . --script res://tests/save_safety_test.gd
      - run: timeout 120s godot --headless --path . --script res://tests/registration_safety_test.gd
      - run: timeout 300s godot --headless --path . --script res://tests/career_ui_test.gd
      - run: godot --headless --path . --script res://tests/rc2_integration_test.gd
