name: RC2 Integration

on:
  pull_request:
    paths:
      - 'application/career/**'
      - 'application/season/**'
      - 'application/settings/**'
      - 'application/release/**'
      - 'application/performance/**'
      - 'core/events/**'
      - 'tests/staff_recruitment_safety_test.gd'
      - 'tests/release_smoke_test.gd'
      - 'tests/completion_features_test_runner.gd'
      - 'tests/event_news_test.gd'
      - 'tests/continuous_attribute_test.gd'
      - 'tests/history_archive_test.gd'
      - 'tests/stadium_management_test.gd'
      - 'tests/training_session_test.gd'
      - 'tests/player_lifecycle_v2_test.gd'
      - 'tests/medical_uncertainty_test.gd'
      - 'tests/living_world_depth_test.gd'
      - 'game/localization/**'
      - 'game/polish/**'
      - 'tools/test-headless.ps1'
      - 'tests/continental_competitions_test.gd'
      - 'tests/career_rollover_test.gd'
      - 'tests/match_participation_test.gd'
      - 'game/career/**'
      - 'game/tactics/**'
      - 'data/**'
      - 'simulation/world/**'
      - 'simulation/players/**'
      - 'simulation/staff/**'
      - 'simulation/scouting/**'
      - 'simulation/transfers/**'
      - 'simulation/match/**'
      - 'simulation/tactics/**'
      - 'simulation/competitions/**'
      - 'simulation/finance/**'
      - 'persistence/**'
      - 'tools/modding/**'
      - 'tests/player_stats_test.gd'
      - 'tests/save_safety_test.gd'
      - 'tests/registration_safety_test.gd'
      - 'tests/career_ui_test.gd'
      - 'tests/rc2_integration_test.gd'
      - '.github/workflows/rc2-integration.yml'
  push:
    branches: ['main', 'prod/rc2-integration', 'production/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rc2-integration:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script import
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/completion_features_test_runner.gd -TimeoutSeconds 300
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/event_news_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/continuous_attribute_test.gd -TimeoutSeconds 180
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/history_archive_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/stadium_management_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/training_session_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/player_lifecycle_v2_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/medical_uncertainty_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/living_world_depth_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/career_rollover_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/continental_competitions_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/staff_recruitment_safety_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/release_smoke_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/match_participation_test.gd
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/player_stats_test.gd -TimeoutSeconds 120
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/save_safety_test.gd -TimeoutSeconds 120
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/registration_safety_test.gd -TimeoutSeconds 120
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/career_ui_test.gd -TimeoutSeconds 300
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/rc2_integration_test.gd
