name: RC2 Integration

on:
  pull_request:
    paths:
      - 'application/career/**'
      - 'application/season/**'
      - 'application/settings/**'
      - 'application/release/**'
      - 'tests/staff_recruitment_safety_test.gd'
      - 'tests/release_smoke_test.gd'
      - 'game/localization/**'
      - 'tools/test-headless.sh'
      - 'tests/continental_competitions_test.gd'
      - 'tests/career_rollover_test.gd'
      - 'tests/match_participation_test.gd'
      - 'game/career/**'
      - 'data/**'
      - 'simulation/players/**'
      - 'simulation/staff/**'
      - 'simulation/scouting/**'
      - 'simulation/transfers/**'
      - 'simulation/match/**'
      - 'simulation/tactics/**'
      - 'simulation/competitions/**'
      - 'persistence/**'
      - 'tests/player_stats_test.gd'
      - 'tests/save_safety_test.gd'
      - 'tests/registration_safety_test.gd'
      - 'tests/career_ui_test.gd'
      - 'tests/rc2_integration_test.gd'
      - '.github/workflows/rc2-integration.yml'
  push:
    branches: ['main', 'prod/rc2-integration', 'production/**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rc2-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: false
      - run: bash tools/test-headless.sh import
      - run: bash tools/test-headless.sh tests/career_rollover_test.gd
      - run: bash tools/test-headless.sh tests/continental_competitions_test.gd
      - run: bash tools/test-headless.sh tests/staff_recruitment_safety_test.gd
      - run: bash tools/test-headless.sh tests/release_smoke_test.gd
      - run: bash tools/test-headless.sh tests/match_participation_test.gd
      - run: bash tools/test-headless.sh tests/player_stats_test.gd 120
      - run: bash tools/test-headless.sh tests/save_safety_test.gd 120
      - run: bash tools/test-headless.sh tests/registration_safety_test.gd 120
      - run: bash tools/test-headless.sh tests/career_ui_test.gd 300
      - run: bash tools/test-headless.sh tests/rc2_integration_test.gd
