name: Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false

      - name: Import and run release tests
        shell: powershell
        run: |
          .\tools\test-headless.ps1 -Script import
          .\tools\test-headless.ps1 -Script tests/phase1011_test_runner.gd
          .\tools\test-headless.ps1 -Script tests/career_rollover_test.gd
          .\tools\test-headless.ps1 -Script tests/continental_competitions_test.gd
          .\tools\test-headless.ps1 -Script tests/match_participation_test.gd
          .\tools\test-headless.ps1 -Script tests/rc2_integration_test.gd
          .\tools\test-headless.ps1 -Script tests/career_ui_test.gd
          .\tools\test-headless.ps1 -Script tests/save_safety_test.gd

      - name: Resolve installed Godot
        shell: powershell
        run: |
          $candidate = $null
          if ($env:GODOT_EXE -and (Test-Path $env:GODOT_EXE)) { $candidate = $env:GODOT_EXE }
          elseif ($env:GODOT_PATH -and (Test-Path $env:GODOT_PATH)) { $candidate = $env:GODOT_PATH }
          else {
            foreach ($name in @('godot','godot4')) {
              $cmd = Get-Command $name -ErrorAction SilentlyContinue
              if ($cmd) { $candidate = $cmd.Source; break }
            }
          }
          if (-not $candidate) { throw 'Godot executable not found for export.' }
          "GODOT_EXE=$candidate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & $candidate --version

      - name: Build Linux release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build/linux | Out-Null
          & $env:GODOT_EXE --headless --path . --export-release 'Linux/X11' build/linux/FootballDynasty.x86_64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build/linux/FootballDynasty.x86_64) -or (Get-Item build/linux/FootballDynasty.x86_64).Length -le 0) { throw 'Linux export missing.' }

      - name: Build Windows release
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path build/windows | Out-Null
          & $env:GODOT_EXE --headless --path . --export-release 'Windows Desktop' build/windows/FootballDynasty.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path build/windows/FootballDynasty.exe) -or (Get-Item build/windows/FootballDynasty.exe).Length -le 0) { throw 'Windows export missing.' }

      - name: Smoke-test Windows release offline
        shell: powershell
        run: .\tools\release-smoke.ps1 -Executable build/windows/FootballDynasty.exe

      - name: Create integrity hashes
        shell: powershell
        run: |
          (Get-FileHash build/linux/FootballDynasty.x86_64 -Algorithm SHA256).Hash.ToLowerInvariant() + '  FootballDynasty.x86_64' | Set-Content build/linux/SHA256SUMS.txt
          (Get-FileHash build/windows/FootballDynasty.exe -Algorithm SHA256).Hash.ToLowerInvariant() + '  FootballDynasty.exe' | Set-Content build/windows/SHA256SUMS.txt

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: FootballDynasty-linux-x86_64
          path: build/linux/

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: FootballDynasty-windows-x86_64
          path: build/windows/
