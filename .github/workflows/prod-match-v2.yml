name: Production Match Engine V2

on:
  pull_request:
    paths:
      - 'simulation/match/spatial_match_engine_v2.gd'
      - 'simulation/match/spatial_state.gd'
      - 'simulation/match/full_match_engine_v2.gd'
      - 'tests/match_engine_v2_test.gd'
      - '.github/workflows/prod-match-v2.yml'
  push:
    branches: ['prod/match-engine-v2']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  match-v2:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script import
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/match_engine_v2_test.gd
