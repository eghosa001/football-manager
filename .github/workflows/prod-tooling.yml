name: Production Developer Tooling

on:
  pull_request:
    paths:
      - 'tools/**'
      - 'tests/world_inspector_test.gd'
      - '.github/workflows/prod-tooling.yml'
  push:
    branches: ['prod/dev-release-tooling']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tooling:
    runs-on: [self-hosted, Windows, X64]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          clean: false
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script import
      - shell: powershell
        run: .\tools\test-headless.ps1 -Script tests/world_inspector_test.gd
